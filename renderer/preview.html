<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Preview</title>
  
  <!-- ── Google Fonts (Full List for Mirroring) ────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- ── Libraries ───────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
  <script src="js/services/mermaid-config.js" defer></script>
  <script src="js/utils/mermaid.js" defer></script>
  <script src="js/utils/code-blocks.js" defer></script>

  <!-- ── Application Styles ─────────────────────────── -->
  <link rel="stylesheet" href="css/styles.css">
  
  <style>
    body {
      background: var(--ds-bg-base);
      color: var(--ds-text-primary);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      font-family: var(--ds-font-family-text);
      -webkit-font-smoothing: antialiased;
    }

    #app-background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      pointer-events: none;
      display: block !important;
    }

    #preview-toolbar {
      height: 41px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      background: var(--ds-surface-overlay);
      backdrop-filter: blur(40px);
      border-bottom: 1px solid var(--ds-border-subtle);
      flex-shrink: 0;
      -webkit-app-region: drag;
      z-index: 10;
    }

    #filename-display {
      font-size: 13px;
      font-weight: 600;
      color: var(--ds-text-secondary);
      flex-grow: 1;
      letter-spacing: -0.01em;
    }

    /* Mirror the main app's glass main panel */
    #preview-content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: var(--ds-space-xl); /* Outer gap match */
      background: var(--ds-surface-main);
      border: 1px solid var(--ds-border-default);
      border-radius: var(--ds-radius-surface);
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: var(--ds-shadow-lg);
    }

    #md-content {
      flex: 1;
      overflow-y: auto;
      padding: 100px var(--ds-content-padding-x); /* Deep padding for mirror effect */
      scroll-behavior: smooth;
    }

    /* Content sizing */
    .md-content-inner {
      max-width: var(--ds-content-width);
      margin: 0 auto;
    }

    /* Typing highlight style */
    .is-preview-active {
      background: var(--ds-white-a10);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    /* Clean up scrollbar to match app */
    #md-content::-webkit-scrollbar {
      width: 4px;
    }
    #md-content::-webkit-scrollbar-thumb {
      background: var(--ds-white-a10);
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <div id="app-background"></div>
  
  <div id="preview-toolbar">
    <div id="filename-display">Preview</div>
  </div>
  
  <div id="preview-content-wrapper">
    <div id="md-content" class="md-content-inner md-render-body"></div>
  </div>

  <!-- Debug Panel: Line Number Tracker (Preview Window) -->
  <div id="debug-line-tracker" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.8);
    color: #0f0;
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    padding: 12px 16px;
    border-radius: 6px;
    z-index: 10000;
    border: 1px solid #0f0;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
    max-width: 250px;
    display: none;
  ">
    <div><strong>[PREVIEW DEBUG]</strong></div>
    <div>Preview Line: <span id="debug-preview-line">-</span></div>
    <div>Scroll: <span id="debug-scroll-pct">-</span>%</div>
    <div style="font-size: 9px; margin-top: 8px; color: #888;">Press <code>Ctrl+D</code> to toggle</div>
  </div>

  <script src="js/services/debug-service.js" defer></script>
  <script src="js/preview-bridge.js" defer></script>
</body>
</html>
